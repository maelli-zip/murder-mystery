# src: https://oneuptime.com/blog/post/2025-12-20-linting-pipeline-github-actions/view

name: Lint-Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint TypeScript Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Run ESLint
        run: npx eslint "frontend/**/*.{ts}"

      - name: Run Prettier check
        run: npx prettier --check "frontend/**/*.{ts}"